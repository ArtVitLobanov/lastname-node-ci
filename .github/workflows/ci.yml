name: Test CI

on:
 push:
  branches: [ main ]

jobs:
 test-node:
  runs-on: ubuntu-latest

  steps:
  - name: Checkout code
    uses: actions/checkout@v6

  - name: Setup Node.js
    uses: actions/setup-node@v6
    with:
     node-version: "26.10.0"

  - name: Install requirements
    run: npm install

  - name: Build
    run: npm run build

  - name: Upload build artifact
    uses: actions/upload-artifact@v7
    with:
     name: build-files
     path: dist/

  - name: Decode SSH key
    run: |
      echo "${{ secrets.GCP_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/deploy_key
      chmod 600 ~/.ssh/deploy_key

  - name: Copy files to GCP
    run: |
      rsync -avz --exclude '.git' --exclude 'node_modules' \
        -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
        ./ "${{ secrets.GCP_USER }}@${{ secrets.GCP_HOST }}:/home/${{ secrets.GCP_USER }}/nodeapp/"

  - name: Run app
    run: |
      ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.GCP_USER }}@${{ secrets.GCP_HOST }} << 'EOF'
      curl -fsSL https://deb.nodesource.com/setup_26.x | sudo -E bash -
      sudo apt-get install -y nodejs
      sudo npm install -g pm2
      cd ~/nodeapp
      npm install
      pm2 restart all || pm2 start dist/index.js --name nodeapp
      EOF
      
